name: Build Android TV APK

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - visionos-fix

jobs:
  test:
    name: Android TV unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Run all core Android TV unit tests
        run: ./gradlew testCoreTvUnitTest --stacktrace -DskipFormatKtlint

      - name: Enable KVM for the Android TV emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android TV D-pad UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          enable-hw-keyboard: true
          disable-animations: true
          script: ./gradlew connectedCoreTvAndroidTest --stacktrace -DskipFormatKtlint -PenableTvUiTestManifest=true

      - name: Upload unit and UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-TV-test-reports
          path: |
            app/build/test-results/testCoreTvUnitTest/*.xml
            app/build/reports/tests/testCoreTvUnitTest/**
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn

  build:
    needs: test
    name: Build Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build Android TV APK
        run: ./gradlew assembleCoreTv --stacktrace -DskipFormatKtlint

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-TV
          path: app/build/outputs/apk/core/tv/*.apk
