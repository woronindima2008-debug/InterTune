name: Build Android TV APK

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - visionos-fix

jobs:
  test:
    name: Android TV unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Run all core Android TV unit tests
        run: ./gradlew testCoreTvUnitTest --stacktrace -DskipFormatKtlint

      - name: Enable KVM for the Android TV emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Find an available Android TV emulator image
        id: tv-image
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          "$SDKMANAGER" --list > "$RUNNER_TEMP/android-sdk-packages.txt"

          TV_IMAGE=$(grep -oE 'system-images;android-[0-9]+;android-tv;x86_64' "$RUNNER_TEMP/android-sdk-packages.txt" | sort -Vu | tail -n 1 || true)
          TV_TARGET=android-tv

          if [ -z "$TV_IMAGE" ]; then
            TV_IMAGE=$(grep -oE 'system-images;android-[0-9]+;google-tv;x86_64' "$RUNNER_TEMP/android-sdk-packages.txt" | sort -Vu | tail -n 1 || true)
            TV_TARGET=google-tv
          fi

          if [ -z "$TV_IMAGE" ]; then
            echo "::error::No Android TV or Google TV x86_64 system image is available from the configured Android SDK repositories."
            grep -E 'system-images;android-[0-9]+;(android-tv|google-tv);' "$RUNNER_TEMP/android-sdk-packages.txt" || true
            exit 1
          fi

          TV_API=$(printf '%s' "$TV_IMAGE" | sed -E 's/system-images;android-([0-9]+);.*/\1/')
          echo "Selected $TV_IMAGE"
          echo "api-level=$TV_API" >> "$GITHUB_OUTPUT"
          echo "target=$TV_TARGET" >> "$GITHUB_OUTPUT"

      - name: Run Android TV D-pad UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: ${{ steps.tv-image.outputs.api-level }}
          target: ${{ steps.tv-image.outputs.target }}
          arch: x86_64
          profile: tv_1080p
          enable-hw-keyboard: true
          disable-animations: true
          script: ./gradlew connectedCoreTvAndroidTest --stacktrace -DskipFormatKtlint -PenableTvUiTestManifest=true

      - name: Upload unit and UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-TV-test-reports
          path: |
            app/build/test-results/testCoreTvUnitTest/*.xml
            app/build/reports/tests/testCoreTvUnitTest/**
            app/build/outputs/androidTest-results/connected/**/*.xml
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn

  build:
    needs: test
    name: Build Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build Android TV APK
        run: ./gradlew assembleCoreTv --stacktrace -DskipFormatKtlint

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-TV
          path: app/build/outputs/apk/core/tv/*.apk
