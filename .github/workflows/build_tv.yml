name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - visionos-fix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build Android TV APK
        run: ./gradlew assembleCoreTv --stacktrace -DskipFormatKtlint

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-TV
          path: app/build/outputs/apk/core/tv/*.apk
