name: Build Android TV APK

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - visionos-fix

jobs:
  test:
    name: Android TV unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Run all core Android TV unit tests
        run: ./gradlew testCoreTvUnitTest --stacktrace -DskipFormatKtlint

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-TV-test-reports
          path: |
            app/build/test-results/testCoreTvUnitTest/*.xml
            app/build/reports/tests/testCoreTvUnitTest/**
          if-no-files-found: warn

  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build Android TV APK
        run: ./gradlew assembleCoreTv --stacktrace -DskipFormatKtlint

      - name: Upload Android TV APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-TV
          path: app/build/outputs/apk/core/tv/*.apk
